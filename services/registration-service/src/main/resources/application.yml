server:
  port: 8080

spring:
  application:
    name: registration-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:registration_db}
    username: ${POSTGRES_USER:lumasoa}
    password: ${POSTGRES_PASSWORD:local_dev_only}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:luma}
    password: ${RABBITMQ_PASSWORD:local_dev_only}
    publisher-confirm-type: correlated
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  reservation:
    hold-ttl-seconds: ${RESERVATION_HOLD_TTL_SECONDS:120}
    expiry-poll-ms: ${RESERVATION_EXPIRY_POLL_MS:5000}
    expiry-batch-size: ${RESERVATION_EXPIRY_BATCH_SIZE:50}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:2000}
  consumer:
    retry-delays-ms: ${CONSUMER_RETRY_DELAYS_MS:1000,5000,25000}
  identity:
    base-url: ${IDENTITY_URL:http://identity-service:8080}
    timeout-ms: ${IDENTITY_TIMEOUT_MS:3000}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{request_id:-}] %logger{36} - %msg%n"