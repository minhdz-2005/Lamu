<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&amp;display=swap');
      .logo-text { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; fill: #20201D; }
      .logo-sub { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 500; fill: #77766F; letter-spacing: 0.12em; text-transform: uppercase; }
    </style>
  </defs>
  
  <!-- Icon Symbol -->
  <g transform="translate(30, 20)">
    <!-- Base circle -->
    <rect width="120" height="120" rx="36" fill="#20201D" />
    
    <!-- Subtle organic warm accent dot representing community & events -->
    <circle cx="94" cy="26" r="10" fill="#E9A45B" />
    
    <!-- Stylized modern geometric "L" -->
    <path d="M46 36 V76 C46 80.4183 49.5817 84 54 84 H82 C85.3137 84 88 86.6863 88 90 C88 93.3137 85.3137 96 82 96 H52 C43.1634 96 36 88.8366 36 80 V36 C36 32.6863 38.6863 30 42 30 C45.3137 30 48 32.6863 48 36 Z" fill="#FBFBFA" />
    
    <!-- Inner soft accent highlight -->
    <circle cx="56" cy="48" r="4" fill="#49735E" opacity="0.9" />
  </g>

  <!-- Wordmark & Tagline -->
  <g transform="translate(175, 45)">
    <text x="0" y="52" class="logo-text" font-size="56" letter-spacing="-0.03em">Lamu</text>
    <text x="2" y="80" class="logo-sub" font-size="11.5">Nền tảng cộng đồng &amp; sự kiện</text>
  </g>
</svg>