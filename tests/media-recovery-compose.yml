# Apply only with a unique lamu-security-test-* project, never demo data.
services:
  identity-db:
    ports: !override []
  gateway:
    ports: !override ["127.0.0.1::8080"]
  identity-mail-worker:
    depends_on:
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1::8025"]
    networks: [backend]
